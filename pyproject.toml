[project]
name = "otel-demo"
version = "0.1.0"
description = "OpenTelemetry Incident Lab: break a small distributed system, trace the failure, find the root cause, fix it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web framework, server, HTTP client
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    # Data stores
    "redis==8.1.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    # Incident definitions (lab-console)
    "pyyaml==6.0.3",
    # OpenTelemetry: API, SDK, OTLP/HTTP exporter (traces, metrics, logs)
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    # OpenTelemetry instrumentation libraries (beta, 0.x versions)
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "opentelemetry-instrumentation-psycopg==0.66b1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "fakeredis[lua]==2.39.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the running Docker stack (docker compose up)"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["common", "gateway", "orders", "inventory", "payment", "lab"]
