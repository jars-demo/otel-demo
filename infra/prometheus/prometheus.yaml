# Prometheus 3.15. Application metrics arrive by push: the Collector sends OTLP to
# /api/v1/otlp (enabled with --web.enable-otlp-receiver). Tempo's metrics-generator pushes
# service-graph metrics by remote write (--web.enable-remote-write-receiver). The scrape jobs
# below are only for the observability stack watching itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Copy these resource attributes onto every series as labels (dots become underscores), so
  # queries can say {service_name="order-service"}. Keep this list short: every label
  # multiplies the number of series. All other resource attributes stay on `target_info`.
  promote_resource_attributes:
    - service.name
    - deployment.environment.name

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order; accept samples up to 30 minutes late.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
