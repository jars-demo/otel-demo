# CI for the OpenTelemetry Incident Lab. Actions are pinned to commit SHAs (tag in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install (Python version from .python-version)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest

  frontend:
    name: Frontend lint, typecheck and builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Build (full app)
        run: npm run build
      - name: Build (public static site)
        run: npm run build:static

  config:
    name: Validate Collector and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose file
        run: docker compose config --quiet
      - name: Collector configurations
        run: |
          for f in collector.yaml collector-sampling.yaml; do
            docker run --rm -v "$PWD/infra/otel/$f:/config.yaml:ro" \
              otel/opentelemetry-collector-contrib:0.162.0 validate --config=/config.yaml
            echo "$f is valid"
          done

  stack:
    name: Build images, run the lab, integration tests
    runs-on: ubuntu-latest
    needs: [python, frontend, config]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Build images
        run: docker compose build
      - name: Start the lab
        run: docker compose up -d --wait
      - name: End-to-end verification
        run: ./scripts/verify.sh
      - name: Integration tests
        run: uv sync --frozen && uv run pytest -m integration
      - name: Container state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v

  security:
    name: Trivy (dependencies, secrets, misconfiguration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
